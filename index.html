<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>For Maram ❤️ — Our Sweet Anniversary</title>
<meta name="description" content="A little digital love letter for our first year together." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PALETTE & TOKENS  —  change these to reshape the whole mood
   ============================================================ */
:root{
  --cream:#FFF8F3;
  --blush:#FDE7E7;
  --petal:#F7C6CC;
  --rose:#E0607B;
  --deep:#9C3350;
  --gold:#C6A268;
  --gold-soft:#E7D3AE;
  --ink:#5E3B46;
  --ink-soft:#8A6673;

  --card-bg:rgba(255,255,255,.72);
  --shadow-soft:0 10px 30px rgba(180,90,110,.14);
  --shadow-lift:0 18px 44px rgba(180,90,110,.26);
  --radius:24px;

  --display:"Playfair Display",Georgia,serif;
  --script:"Great Vibes","Playfair Display",cursive;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;

  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--body);
  color:var(--ink);
  background:linear-gradient(168deg,#FFF8F3 0%,#FDE8E9 42%,#F8CFD5 100%) fixed;
  background-color:#FDE8E9;
  min-height:100vh;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
button{font:inherit;color:inherit;cursor:pointer;}

:focus-visible{outline:2.5px solid var(--rose);outline-offset:3px;border-radius:6px;}

/* ============================================================
   FLOATING HEARTS BACKGROUND (continuous, very soft)
   ============================================================ */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.float-heart{
  position:absolute;bottom:-8vh;
  color:var(--petal);
  opacity:0;
  animation:rise linear infinite;
  will-change:transform,opacity;
}
@keyframes rise{
  0%{transform:translateY(0) rotate(0deg) scale(.9);opacity:0;}
  12%{opacity:.55;}
  85%{opacity:.35;}
  100%{transform:translateY(-118vh) rotate(24deg) scale(1.05);opacity:0;}
}

/* ============================================================
   OPENING SCREEN
   ============================================================ */
#gate{
  position:fixed;inset:0;z-index:50;
  display:grid;place-items:center;
  padding:28px;text-align:center;
  background:linear-gradient(168deg,#FFF9F5 0%,#FDE6E8 55%,#F6C9D0 100%);
  transition:opacity .9s ease, transform .9s cubic-bezier(.22,.9,.3,1), visibility .9s;
}
#gate.opened{opacity:0;transform:scale(1.14);visibility:hidden;pointer-events:none;}
.gate-inner{max-width:520px;animation:gateIn 1.1s cubic-bezier(.22,.9,.3,1) both;}
@keyframes gateIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:none;}}

.envelope{font-size:clamp(3.4rem,13vw,5rem);line-height:1;filter:drop-shadow(0 10px 22px rgba(190,90,115,.32));animation:breathe 3.6s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.08) rotate(2deg);}}

.gate-name{
  font-family:var(--script);
  font-size:clamp(3rem,14vw,5.2rem);
  color:var(--deep);
  margin:.18em 0 .05em;
  line-height:1.05;
  text-shadow:0 2px 20px rgba(255,255,255,.9);
}
.gate-sub{
  font-weight:300;color:var(--ink-soft);
  font-size:clamp(.95rem,3.4vw,1.08rem);
  max-width:34ch;margin:0 auto 1.8em;
}
.rule{display:flex;align-items:center;justify-content:center;gap:.7em;color:var(--gold);margin:0 0 1.4em;}
.rule::before,.rule::after{content:"";height:1px;width:clamp(42px,14vw,84px);background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);}

.gift-btn{
  border:none;border-radius:999px;
  padding:1.05em 2.3em;
  font-size:clamp(1rem,3.8vw,1.12rem);
  font-weight:600;letter-spacing:.2px;
  color:#fff;
  background:linear-gradient(135deg,#E9738C 0%,#D8536F 55%,#C1405F 100%);
  box-shadow:0 12px 30px rgba(196,64,95,.38), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.22,.9,.3,1), box-shadow .3s ease;
}
.gift-btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 18px 40px rgba(196,64,95,.46), inset 0 1px 0 rgba(255,255,255,.5);}
.gift-btn:active{transform:translateY(0) scale(.99);}

/* ============================================================
   MAIN PAGE
   ============================================================ */
#main{
  position:relative;z-index:1;
  max-width:860px;margin:0 auto;
  padding:clamp(48px,11vw,96px) clamp(18px,5vw,32px) 64px;
  opacity:0;transform:scale(.985);
  transition:opacity 1s ease .15s, transform 1s cubic-bezier(.22,.9,.3,1) .15s;
}
#main.visible{opacity:1;transform:none;}

header.hero{text-align:center;margin-bottom:clamp(38px,8vw,60px);}
.hero h1{
  font-family:var(--script);
  font-size:clamp(2.9rem,12vw,4.6rem);
  color:var(--deep);margin:0 0 .1em;line-height:1.08;font-weight:400;
}
.hero .date{
  font-family:var(--display);font-style:italic;
  color:var(--gold);font-size:clamp(1rem,4vw,1.2rem);margin:0 0 .9em;
}
.hero p{margin:0 auto;max-width:40ch;color:var(--ink-soft);font-weight:300;}

/* card grid */
.grid{
  display:grid;gap:clamp(14px,3.5vw,22px);
  grid-template-columns:1fr;
}
@media(min-width:620px){ .grid{grid-template-columns:1fr 1fr;} }

.card{
  position:relative;text-align:left;
  background:var(--card-bg);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(231,211,174,.9);
  border-radius:var(--radius);
  padding:clamp(20px,5vw,28px);
  box-shadow:var(--shadow-soft);
  transition:transform .35s cubic-bezier(.22,.9,.3,1), box-shadow .35s ease, border-color .35s ease;
  opacity:0;transform:translateY(26px);
}
.card.in{opacity:1;transform:none;transition:transform .7s cubic-bezier(.22,.9,.3,1), opacity .7s ease, box-shadow .35s ease;}
.card.in:hover{transform:translateY(-6px) scale(1.022);box-shadow:var(--shadow-lift);border-color:var(--gold);}
.card .ico{font-size:1.9rem;display:block;margin-bottom:.35em;animation:pulseHeart 2.8s ease-in-out infinite;transform-origin:center;}
.card h2{font-family:var(--display);font-weight:600;font-size:clamp(1.15rem,4.4vw,1.35rem);margin:0 0 .25em;color:var(--deep);}
.card p{margin:0;font-size:.94rem;color:var(--ink-soft);font-weight:300;}
@keyframes pulseHeart{0%,100%{transform:scale(1);}50%{transform:scale(1.13);}}

/* the fifth card gets the full width and the boldest treatment */
.card.finale{
  grid-column:1/-1;text-align:center;
  background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(253,225,229,.78));
  border-color:var(--gold);
  box-shadow:0 12px 34px rgba(180,90,110,.18), 0 0 0 6px rgba(255,255,255,.35);
}
.card.finale::after{
  content:"";position:absolute;inset:-2px;border-radius:calc(var(--radius) + 2px);
  box-shadow:0 0 34px rgba(224,96,123,.35);opacity:0;transition:opacity .4s ease;pointer-events:none;
}
.card.finale.in:hover::after{opacity:1;}

footer{text-align:center;margin-top:clamp(40px,9vw,64px);color:var(--ink-soft);font-size:.86rem;font-weight:300;}
footer .sig{font-family:var(--script);font-size:1.7rem;color:var(--rose);display:block;margin-top:.2em;}

/* ============================================================
   MODAL (opens with fade + scale)
   ============================================================ */
#overlay{
  position:fixed;inset:0;z-index:60;
  display:grid;place-items:center;
  padding:clamp(14px,4vw,32px);
  background:rgba(120,50,70,.34);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;visibility:hidden;
  transition:opacity .4s ease, visibility .4s;
}
#overlay.show{opacity:1;visibility:visible;}
.sheet{
  position:relative;width:min(640px,100%);
  max-height:86vh;overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(170deg,#FFFBF8 0%,#FFF2F2 100%);
  border:1px solid var(--gold-soft);
  border-radius:26px;
  padding:clamp(24px,6vw,40px);
  box-shadow:0 26px 70px rgba(120,40,62,.34);
  transform:scale(.92) translateY(14px);opacity:0;
  transition:transform .45s cubic-bezier(.22,.9,.3,1), opacity .45s ease;
}
#overlay.show .sheet{transform:none;opacity:1;}
.sheet h3{font-family:var(--display);color:var(--deep);font-size:clamp(1.4rem,5.4vw,1.8rem);margin:0 0 .1em;font-weight:600;}
.sheet .eyebrow{color:var(--gold);font-family:var(--display);font-style:italic;margin:0 0 1.3em;font-size:.98rem;}
.closer{
  position:absolute;top:12px;right:14px;
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--gold-soft);background:rgba(255,255,255,.85);
  color:var(--deep);font-size:1.1rem;line-height:1;
  display:grid;place-items:center;
  transition:transform .25s ease, background .25s ease;
}
.closer:hover{transform:rotate(90deg) scale(1.06);background:#fff;}

/* gallery */
.gallery{display:grid;gap:18px;grid-template-columns:1fr;}
@media(min-width:520px){ .gallery{grid-template-columns:1fr 1fr;} }
.shot{margin:0;}
.shot img{
  width:100%;aspect-ratio:3/4;object-fit:cover;
  border-radius:16px;border:3px solid #fff;
  box-shadow:0 8px 22px rgba(170,85,105,.2);
  transition:transform .4s cubic-bezier(.22,.9,.3,1);
}
.shot:hover img{transform:scale(1.03) rotate(-.6deg);}
.shot figcaption{font-size:.86rem;color:var(--ink-soft);margin-top:.6em;font-weight:300;font-style:italic;line-height:1.55;}

/* love lines — revealed one by one */
.line{
  opacity:0;transform:translateY(12px);
  margin:0 0 1.15em;font-size:clamp(1rem,4vw,1.08rem);
  transition:opacity .8s ease, transform .8s cubic-bezier(.22,.9,.3,1);
}
.line.on{opacity:1;transform:none;}
.line::first-letter{color:var(--rose);font-family:var(--display);font-size:1.5em;line-height:0;}

/* promises */
.promises{list-style:none;margin:0;padding:0;}
.promises li{
  display:flex;gap:.85em;align-items:flex-start;
  padding:.85em 0;border-bottom:1px dashed rgba(198,162,104,.45);
  opacity:0;transform:translateX(-10px);
  transition:opacity .6s ease, transform .6s ease;
}
.promises li.on{opacity:1;transform:none;}
.promises li:last-child{border-bottom:none;}
.promises .p-ico{font-size:1.3rem;flex:none;line-height:1.4;}

/* counter */
.counter{text-align:center;margin:.5em 0 1.4em;}
.counter .num{
  font-family:var(--display);font-weight:600;
  font-size:clamp(3.6rem,17vw,5.6rem);line-height:1;
  color:var(--deep);
  text-shadow:0 4px 26px rgba(224,96,123,.35);
  display:block;
}
.counter .unit{font-family:var(--display);font-style:italic;color:var(--gold);font-size:1.05rem;}
.stat-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:1.2em 0 0;}
.stat{
  background:rgba(255,255,255,.75);border:1px solid var(--gold-soft);
  border-radius:14px;padding:.6em 1em;text-align:center;min-width:104px;
}
.stat b{display:block;font-family:var(--display);color:var(--deep);font-size:1.25rem;}
.stat span{font-size:.76rem;color:var(--ink-soft);}

.note{font-size:.95rem;font-weight:300;}
.note em{color:var(--rose);font-style:italic;}

/* falling hearts layer for the surprise */
#rain{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden;}
.drop{position:absolute;top:-6vh;animation:fall linear forwards;will-change:transform;}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg);opacity:0;}
  8%{opacity:1;}
  100%{transform:translateY(112vh) rotate(var(--spin,180deg));opacity:0;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  .card,.line,.promises li{opacity:1!important;transform:none!important;}
}
</style>
</head>
<body>

<!-- floating hearts live here -->
<div id="sky" aria-hidden="true"></div>
<div id="rain" aria-hidden="true"></div>

<!-- ============ OPENING SCREEN ============ -->
<div id="gate">
  <div class="gate-inner">
    <div class="envelope" aria-hidden="true">💌</div>
    <h1 class="gate-name">For Maram</h1>
    <div class="rule" aria-hidden="true">❦</div>
    <p class="gate-sub">A whole year of you. I made you something small to say something big.</p>
    <button class="gift-btn" id="openBtn">Open Your Gift 💌</button>
  </div>
</div>

<!-- ============ MAIN PAGE ============ -->
<main id="main">
  <header class="hero">
    <h1>Our Sweet Anniversary</h1>
    <p class="date">October 25 · one year of us</p>
    <p>Five little doors. Open them in any order — they all lead to the same thing.</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    Made slowly, on purpose, for you.
    <span class="sig">Always yours ❤️</span>
  </footer>
</main>

<!-- ============ MODAL ============ -->
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet">
    <button class="closer" id="closeBtn" aria-label="Close">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>

const HER_NAME   = "Maram";                 // ← her name

/* --- photo placeholder generator ---------------------------
   Each photo below uses ph(1), ph(2)… which draws a pink
   placeholder. To use a real picture, replace the whole
   ph(n) call with a path or link, e.g.
        src: "photos/first-date.jpg"
   Keep the quotes. Landscape photos (4:3) look best.
------------------------------------------------------------ */
function ph(n, label){
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +

    '</linearGradient></defs><rect width="600" height="450" fill="url(#g)"/>' +
    '<text x="300" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#B8697E">Photo ' + n + '</text>' +
    '<text x="300" y="248" text-anchor="middle" font-family="Helvetica,Arial" font-size="19" fill="#C98A97">' + label + '</text>' +
    '<text x="300" y="300" text-anchor="middle" font-size="34">❤</text></svg>';
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

/* ════════════════════════════════════════════════════════════
   ✦  Below this line is the machinery. You can ignore it.
   ════════════════════════════════════════════════════════════ */

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const HEART_GLYPHS = ["❤","♥","🤍","🌸","❥"];

/* ---- floating background hearts ---- */
(function sky(){
  if(reduced) return;
  const sky = document.getElementById("sky");
  for(let i=0;i<20;i++){
    const h = document.createElement("span");
    h.className = "float-heart";
    h.textContent = HEART_GLYPHS[Math.floor(Math.random()*HEART_GLYPHS.length)];
    h.style.left = Math.random()*100 + "vw";
    h.style.fontSize = (10 + Math.random()*20) + "px";
    h.style.animationDuration = (16 + Math.random()*16) + "s";
    h.style.animationDelay = (-Math.random()*26) + "s";
    sky.appendChild(h);
  }
})();

/* ---- day counter ---- */
function daysTogether(){
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(START_DATE); start.setHours(0,0,0,0);
  return Math.max(0, Math.round((today - start)/86400000));
}
function daysToAnniversary(){
  const today = new Date(); today.setHours(0,0,0,0);
  let next = new Date(today.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  if(next < today) next = new Date(today.getFullYear()+1, START_DATE.getMonth(), START_DATE.getDate());
  return Math.round((next - today)/86400000);
}

/* ---- build the cards ---- */
const CARDS = [
  ["memories", CONTENT.memories],
  ["why",      CONTENT.why],
  ["promises", CONTENT.promises],
  ["year",     CONTENT.year],
  ["surprise", CONTENT.surprise]
];
const grid = document.getElementById("grid");
CARDS.forEach(([key,c],i)=>{
  const b = document.createElement("button");
  b.className = "card" + (key === "surprise" ? " finale" : "");
  b.dataset.key = key;
  b.style.transitionDelay = (i*70) + "ms";
  b.innerHTML =
    '<span class="ico" aria-hidden="true">'+c.icon+'</span>' +
    '<h2>'+c.title+' '+c.icon+'</h2>' +
    '<p>'+c.blurb+'</p>';
  grid.appendChild(b);
});

/* ---- reveal cards on scroll ---- */
function reveal(el){
  el.classList.add("in");
  // drop the stagger delay afterwards so hover reacts instantly
  setTimeout(()=>{ el.style.transitionDelay = "0ms"; }, 900);
}
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ reveal(e.target); io.unobserve(e.target); } });
},{threshold:.18});
document.querySelectorAll(".card").forEach(c=>io.observe(c));

/* ---- modal ---- */
const overlay = document.getElementById("overlay");
const body    = document.getElementById("sheetBody");
const closeBtn= document.getElementById("closeBtn");
let lastFocus = null;

function render(key){
  const c = CONTENT[key];
  let html = '<h3 id="sheetTitle">'+c.title+' '+c.icon+'</h3><p class="eyebrow">'+c.eyebrow+'</p>';

  if(key === "memories"){
    html += '<div class="gallery">' + c.photos.map((p,i)=>
      '<figure class="shot"><img src="'+p.src+'" alt="Photo '+(i+1)+'" loading="lazy"><figcaption>'+p.caption+'</figcaption></figure>'
    ).join("") + '</div>';
  }
  if(key === "why"){
    html += c.lines.map(l=>'<p class="line">'+l+'</p>').join("");
  }
  if(key === "promises"){
    html += '<ul class="promises">' + c.list.map(p=>
      '<li><span class="p-ico" aria-hidden="true">'+p.ico+'</span><span>'+p.text+'</span></li>'
    ).join("") + '</ul>';
  }
  if(key === "year"){
    const d = daysTogether(), left = daysToAnniversary();
    html += '<div class="counter"><span class="num" id="dayNum">0</span>' +
            '<span class="unit">days together, and counting</span></div>' +
            '<div class="stat-row">' +
              '<div class="stat"><b>'+Math.floor(d/7)+'</b><span>weeks</span></div>' +
              '<div class="stat"><b>'+(d*24).toLocaleString()+'</b><span>hours</span></div>' +
              '<div class="stat"><b>'+(left === 0 ? "today" : left)+'</b><span>'+(left === 0 ? "it\'s the day" : "days to Oct 25")+'</span></div>' +
            '</div>' +
            '<p class="note" style="margin-top:1.6em">'+c.message+'</p>';
  }
  if(key === "surprise"){
    html += '<p class="note">'+c.message+'</p>';
  }
  body.innerHTML = html;

  /* staged reveals inside the sheet */
  if(key === "why")      stagger(".line", 380);
  if(key === "promises") stagger(".promises li", 140);
  if(key === "year")     countUp(document.getElementById("dayNum"), daysTogether());
  if(key === "surprise") heartRain(70);
}

function stagger(sel, gap){
  const nodes = body.querySelectorAll(sel);
  nodes.forEach((n,i)=> setTimeout(()=> n.classList.add("on"), 260 + i*(reduced ? 0 : gap)));
}

function countUp(el, target){
  if(!el) return;
  if(reduced){ el.textContent = target; return; }
  const dur = 1400, t0 = performance.now();
  (function step(t){
    const p = Math.min(1,(t-t0)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(target*eased);
    if(p < 1) requestAnimationFrame(step);
  })(t0);
}

function openSheet(key){
  lastFocus = document.activeElement;
  render(key);
  overlay.classList.add("show");
  document.body.style.overflow = "hidden";
  setTimeout(()=>closeBtn.focus(), 60);
}
function closeSheet(){
  overlay.classList.remove("show");
  document.body.style.overflow = "";
  if(lastFocus) lastFocus.focus();
}

grid.addEventListener("click", e=>{
  const card = e.target.closest(".card");
  if(card) openSheet(card.dataset.key);
});
closeBtn.addEventListener("click", closeSheet);
overlay.addEventListener("click", e=>{ if(e.target === overlay) closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && overlay.classList.contains("show")) closeSheet(); });

/* ---- falling hearts / confetti ---- */
function heartRain(count){
  if(reduced) return;
  const rain = document.getElementById("rain");
  for(let i=0;i<count;i++){
    const d = document.createElement("span");
    d.className = "drop";
    d.textContent = HEART_GLYPHS[Math.floor(Math.random()*HEART_GLYPHS.length)];
    d.style.left = Math.random()*100 + "vw";
    d.style.fontSize = (12 + Math.random()*22) + "px";
    d.style.color = ["#E0607B","#F19AAC","#C6A268","#fff","#9C3350"][Math.floor(Math.random()*5)];
    d.style.setProperty("--spin", (Math.random()*720-360) + "deg");
    const dur = 3.2 + Math.random()*3.4;
    d.style.animationDuration = dur + "s";
    d.style.animationDelay = (Math.random()*1.6) + "s";
    rain.appendChild(d);
    setTimeout(()=>d.remove(), (dur+2)*1000);
  }
}

/* ---- open the gift ---- */
document.getElementById("openBtn").addEventListener("click", ()=>{
  document.getElementById("gate").classList.add("opened");
  document.getElementById("main").classList.add("visible");
  heartRain(34);
  setTimeout(()=>{
    document.querySelectorAll(".card").forEach(reveal);
  }, 320);
});
</script>
</body>
